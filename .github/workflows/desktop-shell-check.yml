name: JRVS Desktop Shell Check

on:
  push:
    branches:
      - desktop-transition
  pull_request:
    branches:
      - desktop-transition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows Tauri build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jrvs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The repository name ends in a period, which Windows disallows in folder names.
          path: jrvs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build desktop application
        run: npm run desktop:build

name: JRVS Desktop Shell Check

on:
  push:
    branches:
      - desktop-transition
  pull_request:
    branches:
      - desktop-transition
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jrvs-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows Tauri build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: D:/a/jrvs
    steps:
      # The GitHub repository name ends in a period. Windows normalises trailing
      # dots in path segments, which breaks the default Actions workspace path.
      # Clone into a stable directory outside GITHUB_WORKSPACE instead.
      - name: Clone source into Windows-safe directory
        shell: pwsh
        working-directory: D:/a
        run: |
          git clone --filter=blob:none --no-checkout "https://github.com/${{ github.repository }}.git" "D:/a/jrvs"
          git -C "D:/a/jrvs" fetch --depth 1 origin "${{ github.sha }}"
          git -C "D:/a/jrvs" checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Repository checkout failed." }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows installers
        run: npm run desktop:build

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe -ErrorAction SilentlyContinue
            Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter *.msi -ErrorAction SilentlyContinue
          )
          if ($installers.Count -eq 0) {
            throw "Tauri build completed but no Windows installer (.exe or .msi) was found."
          }
          $installers | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            Write-Host "$($_.Name)  SHA256: $hash"
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: JRVS-Desktop-Windows-Installers-${{ github.sha }}
          path: |
            D:/a/jrvs/src-tauri/target/release/bundle/nsis/*.exe
            D:/a/jrvs/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
